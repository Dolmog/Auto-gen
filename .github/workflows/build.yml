name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x gradlew && ./gradlew build --no-daemon --stacktrace
      - name: Publish jar on branch "jar"
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir /tmp/out && cp build/libs/*.jar /tmp/out/
          git config user.name "build"; git config user.email "build@users.noreply.github.com"
          git checkout --orphan jar && git rm -rf -q . && cp /tmp/out/*.jar . && git add *.jar
          git commit -q -m "jar" && git push -f origin jar
